[project]
name = "langgraph-base"
version = "0.1.0"
description = "Base project for a LangGraph application"
readme = "README.md"
authors = [
    { name = "HungTc", email = "trcanhhung04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4.0",
    "PyMuPDF>=1.24.0",
    "docling>=2.0.0",
    "elasticsearch>=8.12.0",
    "fastapi>=0.115.0",
    "langchain>=1.2.15",
    "langchain-elasticsearch>=0.3.0",
    "langchain-localai>=0.1.0",
    "langchain-openai>=1.1.12",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.1.6",
    "langgraph-cli[inmem]>=0.4.21",
    "loguru>=0.7.3",
    "minio>=7.2.18",
    "peewee>=3.18.2",
    "pyjwt>=2.10.1",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.35.0",
    "valkey>=6.0.0",
    "xxhash>=3.5.0",
]

[project.scripts]
langgraph-base = "legal_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
