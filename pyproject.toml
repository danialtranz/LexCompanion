[project]
name = "langgraph-base"
version = "0.1.0"
description = "Lex Companion API — legal document Q&A (LangGraph + FastAPI)"
readme = "README.md"
authors = [
    { name = "HungTc", email = "trcanhhung04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    # Database & storage
    "peewee>=3.18.2",
    "psycopg2-binary>=2.9.10",
    "minio>=7.2.18",
    "valkey>=6.0.0",
    # Search & vectors
    "elasticsearch>=8.12.0",
    # LangChain / LangGraph
    "langchain>=1.2.15",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=0.3.0",
    "langchain-elasticsearch>=0.3.0",
    "langchain-localai>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.1.6",
    # Document processing
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "weasyprint>=62.0",
    "docling>=2.0.0",
    "Pillow>=10.4.0",
    "PyMuPDF>=1.24.0",
    "xxhash>=3.5.0",
    # Hugging Face import (admin)
    "datasets>=3.0.0",
    "huggingface-hub>=0.23.0",
    "pyarrow>=15.0.0",
    # Logging
    "loguru>=0.7.3",
    "flagembedding>=1.4.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.21",
]

# Ứng dụng chạy từ repo root: PYTHONPATH=. python -m api.lex_companion_server
# Không build wheel src/langgraph_base (tránh lỗi uv pip install -e .).
[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
