<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LawBot - Đăng nhập</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="big-mark">⚖</div>
    <h1>LAWBOT</h1>
    <p class="role">TRỢ LÝ PHÁP LÝ AI</p>

    <form class="login-form">
      <p style="text-align:center;color:#6f665c;margin-bottom:30px">Đăng nhập để tiếp tục sử dụng LawBot</p>

      <label>Email</label>
      <div class="field">✉ <input placeholder="Nhập email của bạn" /></div>

      <label>Mật khẩu</label>
      <div class="field">⌂ <input placeholder="Nhập mật khẩu của bạn" type="password" /> ◌</div>

      <a class="forgot">Quên mật khẩu?</a>
      <button type="button" class="gold-btn login-submit">Đăng nhập</button>

      <div class="divider">Hoặc đăng nhập với</div>

      <div class="socials">
        <button type="button">G&nbsp;&nbsp; Google</button>
        <button type="button">▦&nbsp;&nbsp; Microsoft</button>
      </div>

      <p class="register">Chưa có tài khoản? <b>Đăng ký ngay</b></p>
    </form>
  </main>
</body>
</html>
