# Lex Companion — khởi động toàn bộ hạ tầng + BE + FE + embedding.
#
# Cổng host = cổng hiện tại + 1 (tránh trùng instance đang chạy ngoài Docker):
#   Postgres 5445 | MinIO 6503/6504 | Redis 6376 | Elasticsearch 6505 | Kibana 5602
#   Embedding 6502 | API 6000 | Web 3005
#
# Chuẩn bị:
#   cp .env.example .env   # nếu chưa có .env ở repo root
#   # Trên Linux, nếu ES không start: sudo sysctl -w vm.max_map_count=262144
#
# Chạy (từ repo root):
#   docker compose -f docker/docker-compose.yml up -d --build

name: lex-companion

services:
  postgres:
    image: postgres:latest
    container_name: lex-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hungtch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-@admin21a1!!2}
      POSTGRES_DB: ${POSTGRES_DB:-lex_companion}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5445:5432"
    volumes:
      - postgres_lex_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hungtch} -d ${POSTGRES_DB:-lex_companion}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio
    container_name: lex-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-hung21az}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-@admin21a1!!2}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "6503:9000"
      - "6504:9001"
    volumes:
      - minio_lex_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2
    restart: always
    container_name: lex-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-redispassword!}" --appendonly yes
    ports:
      - "6376:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redispassword!}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: lex-elasticsearch
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-123456}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ports:
      - "6505:9200"
    volumes:
      - ../model_serving/retrievers/elastic_search/esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:${ELASTIC_PASSWORD:-123456} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s > /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: lex-kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-123456}
    ports:
      - "5602:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  embedding:
    build:
      context: ../model_serving/embeddings/vie_embedding_v2
      dockerfile: dockerFile
    container_name: lex-embedding
    restart: always
    env_file:
      - ../model_serving/embeddings/vie_embedding_v2/.env
    ports:
      - "6502:6501"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6501/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: lex-api
    restart: always
    env_file:
      - ../.env
      - docker-compose.env
    ports:
      - "6000:5999"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5999/openapi.json > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  web:
    build:
      context: ../web
      dockerfile: ../docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_SERVER: http://localhost:6000
        NEXT_PUBLIC_GOOGLE_OAUTH2_CALLBACK: http://localhost:3005/auth/google/callback
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-1081923742602-0rsebq9cjl7du6mbp6lh5hs8835krrbt.apps.googleusercontent.com}
    container_name: lex-web
    restart: always
    ports:
      - "3005:3004"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3004/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_lex_data:
  minio_lex_data:
  redis_data:
  huggingface_cache:
